<div class="mb-4">
  <h4 class="mb-3">Productos Más Vistos</h4>
  <div class="row">
    @for (product of products(); track product.productId) {
      <div class="col-md-3 mb-3">
        <a class="card most-searched-card text-decoration-none text-reset d-block h-100"
           [routerLink]="['/products', product.productId]">
          <img src="assets/images/placeholder.svg" class="card-img-top product-img" alt="{{ product.productName }}">
          <div class="card-body">
            <h6 class="card-title">{{ product.productName }}</h6>
            <p class="text-muted small mb-2">{{ product.productDescription }}</p>
            <div class="mb-2">
              @for (store of product.storeNames; track store) {
                <span class="badge store-badge bg-primary">{{ store }}</span>
              }
            </div>
            <div class="d-flex justify-content-between align-items-center">
              <span class="badge badge-stores">En {{ product.storeCount }} tiendas</span>
              <small class="text-muted">{{ product.productViewCount | number }} vistas</small>
            </div>
          </div>
        </a>
      </div>
    }
  </div>
</div>
